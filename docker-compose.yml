version: '3.8'

services:
  eureka-server:
    build: ./backend/eureka-server
    container_name: subtrack-eureka-server
    ports:
      - "8761:8761"
    networks:
      - subtrack-network

  user-service:
    build: ./backend/user-service
    container_name: subtrack-user-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - subtrack-network

  payment-service:
    build: ./backend/payment-service
    container_name: subtrack-payment-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - subtrack-network

  subscription-service:
    build: ./backend/subscription-service
    container_name: subtrack-subscription-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - payment-service
    networks:
      - subtrack-network

  notification-service:
    build: ./backend/notification-service
    container_name: subtrack-notification-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - user-service
      - subscription-service
    networks:
      - subtrack-network

  api-gateway:
    build: ./backend/api-gateway
    container_name: subtrack-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - user-service
      - subscription-service
      - payment-service
      - notification-service
    networks:
      - subtrack-network

networks:
  subtrack-network:
    driver: bridge
