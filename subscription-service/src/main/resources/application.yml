server:
  port: 8082

spring:
  application:
    name: subscription-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/subtrack_subscription_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Mamatha_01}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Configurable expiry check interval in ms (Default 30 seconds for easy testing)
subscription:
  expiry-check-rate-ms: 30000
